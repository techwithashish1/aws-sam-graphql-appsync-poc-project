type Employee {
	Empid: String!
	Name: String
	Address: String
	PhoneNumber: String
}

type EmployeeConnection {
	items: [Employee]
	nextToken: String
}

type Query {
	getEmployeeDetails(Empid: String!): Employee
	listEmployees(filter: TableEmployeeFilterInput, limit: Int, nextToken: String): EmployeeConnection
}

input CreateEmployeeInput {
	Empid: String!
	Name: String
	Address: String
	PhoneNumber: String
}

input UpdateEmployeeInput {
	Empid: String!
	Name: String
	Address: String
	PhoneNumber: String
}

input DeleteEmployeeInput {
	Empid: String!
}

type Mutation {
	createEmployee(input: CreateEmployeeInput!): Employee
	updateEmployee(input: UpdateEmployeeInput!): Employee
	deleteEmployee(input: DeleteEmployeeInput!): Employee
}

type Subscription {
	onCreateEmployee(
		Empid: String,
		Name: String,
		Address: String,
		PhoneNumber: String
	): Employee
		@aws_subscribe(mutations: ["createEmployee"])
	onUpdateEmployee(
		Empid: String,
		Name: String,
		Address: String,
		PhoneNumber: String
	): Employee
		@aws_subscribe(mutations: ["updateEmployee"])
	onDeleteEmployee(
		Empid: String,
		Name: String,
		Address: String,
		PhoneNumber: String
	): Employee
		@aws_subscribe(mutations: ["deleteEmployee"])
}


input ModelSizeInput {
	ne: Int
	eq: Int
	le: Int
	lt: Int
	ge: Int
	gt: Int
	between: [Int]
}

input TableBooleanFilterInput {
	ne: Boolean
	eq: Boolean
	attributeExists: Boolean
}

input TableEmployeeFilterInput {
	Empid: TableStringFilterInput
	Name: TableStringFilterInput
	Address: TableStringFilterInput
	PhoneNumber: TableStringFilterInput
}

input TableFloatFilterInput {
	ne: Float
	eq: Float
	le: Float
	lt: Float
	ge: Float
	gt: Float
	between: [Float]
	attributeExists: Boolean
}

input TableIDFilterInput {
	ne: ID
	eq: ID
	le: ID
	lt: ID
	ge: ID
	gt: ID
	contains: ID
	notContains: ID
	between: [ID]
	beginsWith: ID
	attributeExists: Boolean
	size: ModelSizeInput
}

input TableIntFilterInput {
	ne: Int
	eq: Int
	le: Int
	lt: Int
	ge: Int
	gt: Int
	between: [Int]
	attributeExists: Boolean
}

input TableStringFilterInput {
	ne: String
	eq: String
	le: String
	lt: String
	ge: String
	gt: String
	contains: String
	notContains: String
	between: [String]
	beginsWith: String
	attributeExists: Boolean
	size: ModelSizeInput
}

